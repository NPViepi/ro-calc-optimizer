<!doctype html>
<!-- `ro-booting` trava a rolagem durante a abertura: o template do simulador é montado
     atrás do splash e faz o documento crescer, o que fazia a barra de rolagem aparecer e
     mudar de tamanho no meio do carregamento. Removida junto com o splash. -->
<html lang="pt-BR" class="ro-booting">
  <head>
    <meta charset="utf-8" />
    <title>Simulador de Dano RO LATAM — Ragnarok Online (Beta)</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Simulador de dano de Ragnarok Online LATAM: calcule o dano por habilidade de 70+ classes (incluindo 4ª classe), importe replays .rrf, salve builds e compartilhe por link. Interface em português (pt-BR)."
    />
    <meta
      name="keywords"
      content="Ragnarok Online, RO LATAM, simulador de dano, calculadora de dano, build, DPS, habilidades, 4ª classe, pt-BR"
    />
    <meta name="author" content="LATAM Tools" />
    <meta name="theme-color" content="#3f9a67" />
    <link rel="canonical" href="https://simulador.latam-tools.com.br/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Simulador de Dano RO LATAM — Ragnarok Online (Beta)" />
    <meta
      property="og:description"
      content="Calcule o dano por habilidade de 70+ classes de Ragnarok Online LATAM, importe replays, salve builds e compartilhe por link."
    />
    <meta property="og:url" content="https://simulador.latam-tools.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Simulador RO LATAM" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://simulador.latam-tools.com.br/assets/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Simulador de Dano RO LATAM" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Simulador de Dano RO LATAM — Ragnarok Online (Beta)" />
    <meta
      name="twitter:description"
      content="Calcule o dano por habilidade de 70+ classes de Ragnarok Online LATAM, importe replays, salve builds e compartilhe por link."
    />
    <meta name="twitter:image" content="https://simulador.latam-tools.com.br/assets/og-cover.png" />

    <link rel="icon" type="image/png" href="https://assets.latam-tools.com.br/image?job=1002&amp;action=0" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Splash pré-bootstrap. Fica dentro de <app-root>; o Angular substitui os filhos do
         elemento ao inicializar, então ele some sozinho e não precisa de teardown. Cores
         fixas (vela-green) e spinner em CSS puro de propósito: cobre justamente a janela em
         que nenhum stylesheet de tema, webfont ou bundle JS chegou ainda. -->
    <style>
      html { font-size: 14px; }
      html.ro-booting,
      html.ro-booting body {
        overflow: hidden;
      }
      .ro-splash {
        position: fixed;
        inset: 0;
        /* Acima das sobreposições da interface durante a abertura. */
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #17212f;
        color: rgba(255, 255, 255, 0.87);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .ro-splash-ring {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #81c784;
        border-radius: 50%;
        animation: ro-splash-spin 0.9s linear infinite;
      }
      .ro-splash-text {
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        opacity: 0.75;
      }
      @keyframes ro-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Saída suave. A remoção do elemento é agendada por setTimeout, não por
         transitionend: numa aba em segundo plano o navegador não compõe quadros, a
         transição não roda e o evento nunca dispara — o splash ficaria preso. */
      .ro-splash.ro-splash--hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        .ro-splash-ring {
          animation-duration: 2.4s;
        }
        .ro-splash.ro-splash--hide {
          transition: none;
        }
      }
    </style>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Simulador de Dano RO LATAM",
        "url": "https://simulador.latam-tools.com.br/",
        "description": "Simulador de dano de Ragnarok Online LATAM: calcule o dano por habilidade de 70+ classes, importe replays .rrf, salve builds e compartilhe por link.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "inLanguage": "pt-BR",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" }
      }
    </script>
  </head>

  <body>
    <!-- Fica FORA do <app-root> de propósito. Dentro dele, o Angular substitui os filhos
         ao inicializar e o splash sumiria antes de o componente da rota (lazy) renderizar
         o seu — dando um piscar de tela vazia no meio da abertura. Aqui ele é um elemento
         só, do primeiro paint até o fim do carregamento, removido uma única vez pelo
         RoCalculatorComponent. -->
    <div class="ro-splash" id="ro-splash">
      <div class="ro-splash-ring"></div>
      <div class="ro-splash-text">Carregando o simulador…</div>
    </div>
    <app-root></app-root>
  </body>
</html>
