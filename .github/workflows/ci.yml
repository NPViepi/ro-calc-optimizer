name: CI

on: pull_request

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release fragments
        run: node tools/release-notes.mjs

      - name: Source and type checks
        run: pnpm lint:check && pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
