appId: br.com.npviepi.rocalcoptimizer
productName: RO Calc Optimizer
directories:
  output: release
files:
  - src/**/*
  - package.json
# Build web gerado por scripts/build-web.mjs a partir do código do upstream.
extraResources:
  - from: web
    to: web
win:
  target: nsis
nsis:
  # Sem espaços: o latest.yml aponta para este nome, e o job electron-bridge do CI envia o
  # arquivo com `gh release upload` (que trocaria espaços por pontos).
  artifactName: RO-Calc-Optimizer-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
linux:
  target: AppImage
# Auto-update: os instaladores e o latest.yml vão para as GitHub Releases do fork.
publish:
  provider: github
  owner: NPViepi
  repo: ro-calc-optimizer
  releaseType: release
